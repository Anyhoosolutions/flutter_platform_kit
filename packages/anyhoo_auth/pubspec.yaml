name: anyhoo_auth
resolution: workspace
description: A flexible authentication package that supports custom user models using generics.
version: 0.0.32
publish_to: none
homepage: https://anyhoosolutions.web.app/documentation/flutter_platform_kit

environment:
  sdk: ^3.6.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  anyhoo_core:
    path: ../anyhoo_core
  anyhoo_logging:
    path: ../anyhoo_logging
  anyhoo_models:
    path: ../anyhoo_models
  flutter_bloc: ^9.1.1
  firebase_auth: ^6.5.7
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0
  flutter_svg: ^2.3.0
  cloud_firestore: ^6.8.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  logging: ^1.3.0
  freezed_annotation: ^3.1.0

  anyhoo_extension_methods:
    path: ../anyhoo_extension_methods

dev_dependencies:
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  build_runner: ^2.10.4
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
