name: flutter_platform_kit
description: Monorepo for Anyhoo Flutter platform packages, apps, and tools.
publish_to: none

environment:
  sdk: ^3.9.0

workspace:
  - packages/anyhoo_app_bar
  - packages/anyhoo_auth
  - packages/anyhoo_core
  - packages/anyhoo_firebase
  - packages/anyhoo_form_builder_widgets
  - packages/anyhoo_image_selector
  - packages/anyhoo_logging
  - packages/anyhoo_map
  - packages/anyhoo_remote_config
  - packages/anyhoo_router
  - packages/anyhoo_search_bar
  - packages/anyhoo_shimmer
  - packages/screenshot_kit
  - packages/widgetbook_wrappers
  - example_app
  - widgetbook
  - tools/sentry_cli
  - tools/widgetbook_screenshots
  - scripts/toc_generator

dev_dependencies:
  melos: ^7.0.0

melos:
  categories:
    libs:
      - packages/**
    apps:
      - example_app
      - widgetbook
    tools:
      - tools/**
      - scripts/**

  scripts:
    analyze:
      description: Run flutter analyze in all packages
      run: melos exec --concurrency=1 -- flutter analyze

    test:
      description: Run flutter test in lib and tool packages (excludes apps/goldens)
      run: melos exec --concurrency=1 --fail-fast --dir-exists=test --category=libs --category=tools -- flutter test

    test:apps:
      description: Run flutter test in example_app and widgetbook
      run: melos exec --concurrency=1 --fail-fast --dir-exists=test --category=apps -- flutter test

    clean:deep:
      description: Clean Flutter/Dart build artifacts across the workspace
      run: melos exec --concurrency=1 -- flutter clean
